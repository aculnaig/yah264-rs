[package]
name = "yah264"
description = "Safe Rust wrapper for the yah264 H.264 encoder"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "encode"
path = "examples/encode.rs"

[dependencies]
yah264-sys = { path = "../yah264-sys" }
zerocopy.workspace = true

[dev-dependencies]
regex = "1.3"

[features]
default = ["high-level-api"]
low-level-api = []
high-level-api = ["low-level-api"]
